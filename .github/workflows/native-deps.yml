# Builds the native (C) dependencies vmmc can't build with cargo (OVMF, and the TPM 2.0
# reference implementation with OpenSSL), and publishes them as a
# GitHub release that `cargo xtask fetch-native` downloads by pinned SHA-256.
#
# Run it from the Actions tab (or `gh workflow run native-deps.yml -f release=native-deps-N`),
# then pin the new SHA256SUMS in xtask/src/native.rs.
name: native-deps

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create, e.g. native-deps-1
        required: true

permissions:
  contents: write

env:
  EDK2_TAG: edk2-stable202608
  VIRT_FIRMWARE_VERSION: "26.9"
  TPM_REF_TAG: v1.83r1
  # vcpkg release whose baseline builds OpenSSL 3.6.5.
  VCPKG_TAG: "2026.07.29"

jobs:
  ovmf:
    name: OVMF (Secure Boot, no SMM, TPM 2.0; plus a test build with the shell)
    runs-on: ubuntu-24.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev acpica-tools nasm python3 python3-venv

      - name: Fetch edk2 ${{ env.EDK2_TAG }}
        run: |
          git clone --depth 1 --branch "$EDK2_TAG" https://github.com/tianocore/edk2.git
          git -C edk2 submodule update --init --depth 1 --recommend-shallow

      # SMM stays off: WHP can't emulate it. Secure Boot then works, but the variable
      # store isn't protected from the guest OS kernel. Debug builds log to I/O port
      # 0x402 (DEBUG_ON_SERIAL_PORT left undefined).
      #
      # edk2 leaves the UEFI shell out of Secure Boot builds, as it should for what
      # ships. Tests drive the firmware through the shell, so a third build (debug)
      # has Secure Boot off.
      - name: Build
        working-directory: edk2
        run: |
          make -C BaseTools -j"$(nproc)"
          source edksetup.sh
          common="-a X64 -t GCC -p OvmfPkg/OvmfPkgX64.dsc -n $(nproc)
                  -D SMM_REQUIRE=FALSE -D TPM2_ENABLE=TRUE -D FD_SIZE_4MB
                  -D NETWORK_HTTP_BOOT_ENABLE=FALSE -D NETWORK_TLS_ENABLE=FALSE"
          fv=Build/OvmfX64
          mkdir -p ../fv
          build $common -D SECURE_BOOT_ENABLE=TRUE -b RELEASE
          cp $fv/RELEASE_GCC/FV/OVMF_CODE.fd ../fv/OVMF_CODE.fd
          cp $fv/RELEASE_GCC/FV/OVMF_VARS.fd ../fv/OVMF_VARS.fd
          build $common -D SECURE_BOOT_ENABLE=TRUE -b DEBUG
          cp $fv/DEBUG_GCC/FV/OVMF_CODE.fd ../fv/OVMF_CODE.debug.fd
          rm -rf $fv/DEBUG_GCC
          build $common -D SECURE_BOOT_ENABLE=FALSE -b DEBUG
          cp $fv/DEBUG_GCC/FV/OVMF_CODE.fd ../fv/OVMF_CODE.test.fd

      - name: Package and enroll Secure Boot keys
        run: |
          python3 -m venv venv
          venv/bin/pip install "virt-firmware==$VIRT_FIRMWARE_VERSION"
          mkdir dist
          cp fv/OVMF_CODE.fd fv/OVMF_CODE.debug.fd fv/OVMF_CODE.test.fd dist/
          # Variable store templates: empty (Secure Boot off), and with a generated
          # vmmc platform key plus Microsoft's 2011 and 2023 KEK and db certificates.
          cp fv/OVMF_VARS.fd dist/OVMF_VARS.fd
          venv/bin/virt-fw-vars --input fv/OVMF_VARS.fd \
            --output dist/OVMF_VARS.secboot.fd \
            --enroll-generate "vmmc Platform Key" \
            --microsoft-kek all --microsoft-db all --secure-boot
          venv/bin/virt-fw-vars --input dist/OVMF_VARS.secboot.fd --print > dist/OVMF_VARS.secboot.txt
          cp edk2/License.txt dist/OVMF-LICENSE.txt
          {
            echo "edk2 tag: $EDK2_TAG"
            echo "edk2 commit: $(git -C edk2 rev-parse HEAD)"
            echo "platform: OvmfPkg/OvmfPkgX64.dsc, toolchain GCC"
            echo "defines: SMM_REQUIRE=FALSE TPM2_ENABLE=TRUE FD_SIZE_4MB"
            echo "         NETWORK_HTTP_BOOT_ENABLE=FALSE NETWORK_TLS_ENABLE=FALSE"
            echo "OVMF_CODE.fd:       RELEASE, SECURE_BOOT_ENABLE=TRUE"
            echo "OVMF_CODE.debug.fd: DEBUG, SECURE_BOOT_ENABLE=TRUE"
            echo "OVMF_CODE.test.fd:  DEBUG, SECURE_BOOT_ENABLE=FALSE (has the UEFI shell)"
            echo "keys: virt-firmware $VIRT_FIRMWARE_VERSION --enroll-generate --microsoft-kek all --microsoft-db all"
          } > dist/OVMF-BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ovmf
          path: dist/

  tpm:
    name: TPM 2.0 reference implementation (static MSVC libraries)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch ms-tpm-20-ref ${{ env.TPM_REF_TAG }}
        run: git clone --depth 1 --branch $env:TPM_REF_TAG https://github.com/microsoft/ms-tpm-20-ref.git

      # Static libraries against the dynamic CRT (/MD), as Rust's MSVC targets link.
      - name: Build OpenSSL (vcpkg, x64-windows-static-md)
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout $env:VCPKG_TAG
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe install openssl:x64-windows-static-md

      # A VM's TPM, not a simulator: SIMULATION enables reproducible RNG seeding and
      # key caching meant for tests, and forced failure mode is a test hook.
      - name: Configure the TPM for a VM
        run: |
          $file = 'ms-tpm-20-ref/TPMCmd/TpmConfiguration/TpmConfiguration/TpmBuildSwitches.h'
          $text = Get-Content -Raw $file
          $text = $text -replace '#define SIMULATION\s+YES', '#define SIMULATION NO'
          $text = $text -replace '#define ALLOW_FORCE_FAILURE_MODE\s+YES', '#define ALLOW_FORCE_FAILURE_MODE NO'
          if ($text -notmatch '#define SIMULATION NO' -or $text -notmatch '#define ALLOW_FORCE_FAILURE_MODE NO') {
            throw 'build switches not found'
          }
          Set-Content -NoNewline -Path $file -Value $text

      # Ninja with one build type, as the project's own scripts build it (its
      # Visual Studio projects have no Release|x64 configuration).
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # FILE_BACKED_NV=0 keeps the NV image in memory: vmmc saves it to the VM's
      # tpm-state.bin, rather than the reference platform writing ./NVChip.
      - name: Build
        run: |
          # The project looks for OpenSSL's headers in TPMCmd/OsslInclude/x64, as its
          # scripts/getossl.cmd lays them out.
          $headers = 'ms-tpm-20-ref/TPMCmd/OsslInclude/x64'
          New-Item -ItemType Directory -Force $headers | Out-Null
          Copy-Item -Recurse 'vcpkg/installed/x64-windows-static-md/include/openssl' $headers
          $env:CL = '/DFILE_BACKED_NV=0'
          cmake -S ms-tpm-20-ref/TPMCmd -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel `
            --target Tpm_PlatformLib Tpm_CoreLib Tpm_CryptoLib_Math_Ossl

      - name: Package
        run: |
          $ossl = 'vcpkg/installed/x64-windows-static-md'
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem build -Recurse -Filter *.lib |
            ForEach-Object { Copy-Item $_.FullName (Join-Path dist ("tpm-" + $_.Name)) }
          Copy-Item "$ossl/lib/libcrypto.lib" dist/tpm-libcrypto.lib
          Copy-Item ms-tpm-20-ref/LICENSE dist/TPM-REF-LICENSE.txt
          Copy-Item "$ossl/share/openssl/copyright" dist/OPENSSL-LICENSE.txt
          @(
            "ms-tpm-20-ref tag: $env:TPM_REF_TAG"
            "ms-tpm-20-ref commit: $(git -C ms-tpm-20-ref rev-parse HEAD)"
            "vcpkg tag: $env:VCPKG_TAG ($(git -C vcpkg rev-parse HEAD))"
            "OpenSSL: $(.\vcpkg\vcpkg.exe list openssl)"
            'triplet: x64-windows-static-md (static libraries, dynamic CRT)'
            'switches: SIMULATION NO, ALLOW_FORCE_FAILURE_MODE NO, FILE_BACKED_NV 0, Release'
            "libraries: $((Get-ChildItem dist -Filter *.lib).Name -join ' ')"
          ) | Set-Content dist/TPM-BUILD-INFO.txt
          Get-Content dist/TPM-BUILD-INFO.txt
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: tpm
          path: dist/

  publish:
    name: Publish release
    needs: [ovmf, tpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Native dependencies ($TAG)" \
            --notes "OVMF from $EDK2_TAG (SMM off, TPM 2.0; Secure Boot on except in the test build), and the TPM 2.0 reference implementation ($TPM_REF_TAG) with OpenSSL. See OVMF-BUILD-INFO.txt and TPM-BUILD-INFO.txt." \
            *

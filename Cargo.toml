[workspace]
resolver = "3"
members = ["bins/*", "crates/*", "xtask"]
# Patched upstream crates (see [patch.crates-io]); not part of the workspace proper.
exclude = ["third_party"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
devices = { path = "crates/devices" }
disk = { path = "crates/disk" }
net = { path = "crates/net" }
hv = { path = "crates/hv" }
hv-whp = { path = "crates/hv-whp" }
machine = { path = "crates/machine" }
tpm = { path = "crates/tpm" }
vm-core = { path = "crates/vm-core" }

acpi_tables = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
# No chrono: file times come out as the FAT epoch, which keeps images reproducible.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
linux-loader = { version = "0.14.0", default-features = false, features = ["bzimage"] }
png = "0.18.1"
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "auto-icmp-echo-reply",
] }
ruzstd = "0.9.1"
# The console window: software rendering through winit, no GPU needed.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
virtio-bindings = "0.2.7"
virtio-queue = "0.18.0"
# The default `rawfd` feature is Unix-only and breaks the Windows build.
vm-memory = { version = "0.18.0", default-features = false, features = ["backend-mmap"] }
vm-superio = "0.8.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Hypervisor",
    "Win32_System_LibraryLoader",
] }

# Upstream releases that enable vm-memory's Unix-only default features. Each directory's
# VMMC-PATCH.md says what changed and when the patch can go.
[patch.crates-io]
linux-loader = { path = "third_party/linux-loader" }
virtio-queue = { path = "third_party/virtio-queue" }

# Unpacking the test initrd is far too slow unoptimized.
# Dependencies are built optimized even in dev builds: the console window's renderer
# (Slint) is unusably slow without, and they're rarely what's being debugged.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ruzstd]
opt-level = 3

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
